<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Mini Bot — Web Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b0f17;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .bot-card {
      width: 100%;
      max-width: 350px;
      background-color: #0e131b;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #94a3b8;
    }
    .status-badge {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 9px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 600;
    }
    /* Signal Card */
    .signal-card {
      background: #161f2e;
      border: 1px solid #253347;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.3s ease;
    }
    .signal-text {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #94a3b8;
    }
    .confidence-text {
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
    }
    .time-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .badge {
      flex: 1;
      background: #0f172a;
      color: #cbd5e1;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 5px;
      font-size: 11px;
      font-weight: 600;
    }
    .progress-bar-bg {
      width: 100%;
      height: 5px;
      background-color: #1e293b;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #3b82f6;
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    /* CALL State */
    .signal-call {
      background: #064e3b !important;
      border-color: #10b981 !important;
    }
    .signal-call .signal-text { color: #34d399 !important; }
    .signal-call .confidence-text { color: #a7f3d0 !important; }
    .signal-call .badge {
      background: #042f2e !important;
      color: #6ee7b7 !important;
      border-color: #0d9488 !important;
    }
    .signal-call .progress-bar-fill { background-color: #10b981 !important; }

    /* PUT State */
    .signal-put {
      background: #4c0519 !important;
      border-color: #f43f5e !important;
    }
    .signal-put .signal-text { color: #fb7185 !important; }
    .signal-put .confidence-text { color: #fecdd3 !important; }
    .signal-put .badge {
      background: #2e0814 !important;
      color: #fda4af !important;
      border-color: #e11d48 !important;
    }
    .signal-put .progress-bar-fill { background-color: #f43f5e !important; }

    /* Metric Tiles */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .tile {
      background: #161f2e;
      border: 1px solid #253347;
      border-radius: 8px;
      padding: 6px 4px;
      text-align: center;
    }
    .tile-title {
      font-size: 8px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .tile-val {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
      margin-top: 2px;
    }
    /* Info Banner */
    .info-banner {
      background: #141b27;
      border: 1px solid #1e293b;
      border-left: 3px solid #38bdf8;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.3;
    }
    /* Selectors */
    select {
      background: #161f2e;
      color: #cbd5e1;
      border: 1px solid #253347;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    /* Buttons */
    .btn-row {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .primary-btn {
      background: #2563eb;
      color: #fff;
      border: 1px solid #3b82f6;
    }
    .primary-btn:hover { background: #1d4ed8; }
    .secondary-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .secondary-btn:hover { background: #334155; }
    .subtle-btn {
      background: transparent;
      color: #64748b;
      border: 1px solid #1e293b;
      padding: 6px;
      font-size: 11px;
    }
    .subtle-btn:hover { background: #161f2e; color: #cbd5e1; }
    .demo-btn {
      background: #1e1b4b;
      color: #c7d2fe;
      border: 1px solid #4338ca;
      padding: 6px;
      font-size: 11px;
    }
    .demo-btn:hover { background: #312e81; color: #e0e7ff; }
    .footer-text {
      text-align: center;
      font-size: 10px;
      color: #475569;
    }
    video, canvas { display: none; }
  </style>
</head>
<body>

  <div class="bot-card">
    <div class="header">
      <span class="title">POCKET BOT</span>
      <span class="status-badge" id="statusBadge">Listo</span>
    </div>

    <!-- Signal Hero Card -->
    <div class="signal-card" id="signalCard">
      <div class="signal-text" id="signalText">ESPERAR</div>
      <div class="confidence-text" id="confidenceText">Confianza: —</div>
      <div class="time-row">
        <div class="badge" id="expBadge">⏱️ Tiempo: —</div>
        <div class="badge" id="countdownBadge">⏳ Restante: —</div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Metrics -->
    <div class="metrics-grid">
      <div class="tile">
        <div class="tile-title">RSI</div>
        <div class="tile-val" id="rsiVal">—</div>
      </div>
      <div class="tile">
        <div class="tile-title">TENDENCIA</div>
        <div class="tile-val" id="trendVal">—</div>
      </div>
      <div class="tile">
        <div class="tile-title">TIEMPO</div>
        <div class="tile-val" id="timeVal">—</div>
      </div>
      <div class="tile">
        <div class="tile-title">VELAS</div>
        <div class="tile-val" id="candlesVal">—</div>
      </div>
    </div>

    <!-- Info banner -->
    <div class="info-banner" id="infoBanner">
      Haz clic en «Capturar Pestaña» para seleccionar la ventana de Pocket Option o usa «Probar Demo».
    </div>

    <!-- Mode Selector -->
    <select id="timeMode">
      <option value="auto">⏱️ Tiempo: Automático (IA)</option>
      <option value="60">⏱️ Fijar a 1 min (M1)</option>
      <option value="120">⏱️ Fijar a 2 min (M2)</option>
      <option value="180">⏱️ Fijar a 3 min (M3)</option>
      <option value="300">⏱️ Fijar a 5 min (M5)</option>
    </select>

    <!-- Analysis Interval -->
    <select id="intervalSelect">
      <option value="5">🔄 Análisis: Cada 5 segundos</option>
      <option value="10">🔄 Análisis: Cada 10 segundos</option>
      <option value="15">🔄 Análisis: Cada 15 segundos</option>
      <option value="30">🔄 Análisis: Cada 30 segundos</option>
    </select>

    <!-- Buttons -->
    <div class="btn-row">
      <button class="secondary-btn" id="captureBtn">🎯 Capturar Pestaña</button>
      <button class="primary-btn" id="startBtn">▶ Iniciar</button>
    </div>

    <div class="btn-row">
      <button class="subtle-btn" id="analyzeBtn">⚡ Analizar</button>
      <button class="demo-btn" id="demoBtn">🧪 Probar Demo</button>
    </div>

    <div class="footer-text" id="footerText">Web Edition · Compatible con Vercel</div>
  </div>

  <video id="screenVideo" autoplay playsinline></video>
  <canvas id="analysisCanvas"></canvas>

  <script>
    let mediaStream = null;
    let analysisInterval = null;
    let countdownInterval = null;
    let remainingSeconds = 0;
    let totalSeconds = 0;
    let isRunning = false;
    let demoToggle = false;

    const video = document.getElementById('screenVideo');
    const canvas = document.getElementById('analysisCanvas');
    const ctx = canvas.getContext('2d');

    const statusBadge = document.getElementById('statusBadge');
    const signalCard = document.getElementById('signalCard');
    const signalText = document.getElementById('signalText');
    const confidenceText = document.getElementById('confidenceText');
    const expBadge = document.getElementById('expBadge');
    const countdownBadge = document.getElementById('countdownBadge');
    const progressFill = document.getElementById('progressFill');

    const rsiVal = document.getElementById('rsiVal');
    const trendVal = document.getElementById('trendVal');
    const timeVal = document.getElementById('timeVal');
    const candlesVal = document.getElementById('candlesVal');
    const infoBanner = document.getElementById('infoBanner');
    const footerText = document.getElementById('footerText');

    const timeMode = document.getElementById('timeMode');
    const intervalSelect = document.getElementById('intervalSelect');
    const captureBtn = document.getElementById('captureBtn');
    const startBtn = document.getElementById('startBtn');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const demoBtn = document.getElementById('demoBtn');

    // Screen Capture
    captureBtn.addEventListener('click', async () => {
      try {
        mediaStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: false });
        video.srcObject = mediaStream;
        statusBadge.innerText = "Conectado";
        infoBanner.innerText = "Pestaña capturada correctamente. Pulsa «Iniciar» para comenzar el análisis.";
      } catch (err) {
        infoBanner.innerText = "No se otorgó permiso de captura de pantalla: " + err.message;
      }
    });

    // Toggle loop
    startBtn.addEventListener('click', () => {
      if (isRunning) {
        stopAnalysis();
      } else {
        startAnalysis();
      }
    });

    function startAnalysis() {
      if (!mediaStream && !demoToggle) {
        alert("Primero pulsa «🎯 Capturar Pestaña» o usa «🧪 Probar Demo».");
        return;
      }
      isRunning = true;
      startBtn.innerText = "⏸ Pausar";
      statusBadge.innerText = "En vivo";
      const intervalSec = parseInt(intervalSelect.value, 10);
      performAnalysis();
      analysisInterval = setInterval(performAnalysis, intervalSec * 1000);
    }

    function stopAnalysis() {
      isRunning = false;
      startBtn.innerText = "▶ Iniciar";
      statusBadge.innerText = "Pausado";
      clearInterval(analysisInterval);
    }

    analyzeBtn.addEventListener('click', performAnalysis);

    function performAnalysis() {
      if (!video.videoWidth || !video.videoHeight) return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);

      const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = frame.data;
      const w = canvas.width;
      const h = canvas.height;

      let greenCount = 0;
      let redCount = 0;
      let candles = [];

      for (let x = 0; x < w; x += Math.max(2, Math.floor(w / 120))) {
        let gY = [];
        let rY = [];
        for (let y = 0; y < h; y += 2) {
          const idx = (y * w + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];
          if (g > 100 && g > r * 1.25 && g > b * 1.25) gY.push(y);
          if (r > 100 && r > g * 1.3 && r > b * 1.3) rY.push(y);
        }
        if (gY.length > 5 && gY.length > rY.length * 1.2) {
          candles.push({ y: gY[Math.floor(gY.length / 2)], dir: 1 });
        } else if (rY.length > 5 && rY.length > gY.length * 1.2) {
          candles.push({ y: rY[Math.floor(rY.length / 2)], dir: -1 });
        }
      }

      if (candles.length < 5) {
        infoBanner.innerText = "Pocas velas detectadas. Ajusta el zoom o enfoque en Pocket Option.";
        return;
      }

      const prices = candles.map(c => -c.y);
      let gains = 0, losses = 0;
      for (let i = 1; i < prices.length; i++) {
        const diff = prices[i] - prices[i - 1];
        if (diff > 0) gains += diff; else losses -= diff;
      }
      const rsi = losses === 0 ? 100 : Math.round(100 - (100 / (1 + (gains / Math.max(1, losses)))));
      const fast = prices.slice(-5).reduce((a, b) => a + b, 0) / 5;
      const slow = prices.slice(-12).reduce((a, b) => a + b, 0) / Math.min(12, prices.length);
      const trend = fast > slow ? "Alcista" : fast < slow ? "Bajista" : "Lateral";

      let sig = "ESPERAR";
      if (trend === "Alcista" && candles[candles.length - 1].dir > 0 && rsi < 70) sig = "CALL";
      else if (trend === "Bajista" && candles[candles.length - 1].dir < 0 && rsi > 30) sig = "PUT";

      const conf = sig === "ESPERAR" ? 50 : Math.min(88, 60 + Math.abs(rsi - 50));
      let durSec = 60;
      let durLabel = "1 MIN";
      if (timeMode.value !== "auto") {
        durSec = parseInt(timeMode.value, 10);
        durLabel = (durSec / 60) + " MIN";
      } else {
        durLabel = Math.abs(fast - slow) > 8 ? "1 MIN" : "2 MIN";
        durSec = durLabel === "1 MIN" ? 60 : 120;
      }

      applySignal(sig, conf, durLabel, durSec, rsi, trend, candles.length);
    }

    // Demo Mode
    demoBtn.addEventListener('click', () => {
      demoToggle = !demoToggle;
      const sig = demoToggle ? "CALL" : "PUT";
      const conf = Math.floor(Math.random() * 11) + 78;
      const rsi = sig === "CALL" ? (Math.random() * 12 + 34).toFixed(1) : (Math.random() * 12 + 63).toFixed(1);
      const trend = sig === "CALL" ? "Alcista" : "Bajista";
      const candles = Math.floor(Math.random() * 14) + 20;

      let durSec = 60;
      let durLabel = "1 MIN";
      if (timeMode.value !== "auto") {
        durSec = parseInt(timeMode.value, 10);
        durLabel = (durSec / 60) + " MIN";
      } else {
        const opts = [["1 MIN", 60], ["2 MIN", 120], ["5 MIN", 300]];
        const pick = opts[Math.floor(Math.random() * opts.length)];
        durLabel = pick[0];
        durSec = pick[1];
      }

      applySignal(sig, conf, durLabel, durSec, rsi, trend, candles);
      statusBadge.innerText = "Modo Demo";
      infoBanner.innerText = `Prueba simulada: Señal ${sig} para ${durLabel} con tendencia ${trend.toLowerCase()}.`;
    });

    function applySignal(sig, conf, durLabel, durSec, rsi, trend, count) {
      signalText.innerText = sig;
      confidenceText.innerText = `Confianza: ${conf}%`;
      rsiVal.innerText = rsi;
      trendVal.innerText = trend;
      candlesVal.innerText = count;

      signalCard.className = "signal-card " + (sig === "CALL" ? "signal-call" : sig === "PUT" ? "signal-put" : "");

      if (sig === "CALL" || sig === "PUT") {
        expBadge.innerText = `⏱️ Tiempo: ${durLabel}`;
        timeVal.innerText = durLabel;
        startCountdown(durSec);
      } else {
        expBadge.innerText = "⏱️ Tiempo: Esperar";
        timeVal.innerText = "—";
        countdownBadge.innerText = "⏳ Restante: —";
        progressFill.style.width = "0%";
        clearInterval(countdownInterval);
      }
      footerText.innerText = "Actualizado: " + new Date().toLocaleTimeString();
    }

    function startCountdown(sec) {
      clearInterval(countdownInterval);
      totalSeconds = sec;
      remainingSeconds = sec;
      updateCountdownUI();

      countdownInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateCountdownUI();
        } else {
          clearInterval(countdownInterval);
          countdownBadge.innerText = "⏳ Cumplido";
          progressFill.style.width = "0%";
        }
      }, 1000);
    }

    function updateCountdownUI() {
      const m = Math.floor(remainingSeconds / 60);
      const s = remainingSeconds % 60;
      countdownBadge.innerText = `⏳ Restante: ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      const pct = (remainingSeconds / totalSeconds) * 100;
      progressFill.style.width = pct + "%";
    }
  </script>
</body>
</html>
